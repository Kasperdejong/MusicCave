name: Keep Supabase Alive

on:
  schedule:
    - cron: "0 0 */4 * *"
  workflow_dispatch:

jobs:
  ping-db:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        run: |
          # Replace 'songs' with any real table name in your musiccave database
          TABLE_NAME="user_songs"

          # Clean URL in case it has a trailing slash
          CLEAN_URL=$(echo "${{ secrets.SUPABASE_URL }}" | sed 's:/*$::')

          curl --fail --show-error -s -L \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "$CLEAN_URL/rest/v1/$TABLE_NAME?select=*&limit=1"
